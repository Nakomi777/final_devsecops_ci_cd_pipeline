name: DevSecOps CI Pipeline

on:
    push:
        branches: ["main", "master"]
    pull_request:
        branches: ["main", "master"]
    workflow_dispatch: {}

permissions:
    contents: read
    pull-requests: read

jobs:
    sast-scan:
        name: Semgrep SAST Scan
        runs-on: ubuntu-latest
        container:
            image: semgrep/semgrep
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Run Semgrep SAST
              run: semgrep scan --config auto --error --verbose --exclude=".github"

    pylint-check:
        name: Pylint Code Quality Gate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pylint
                  pip install -r requirements.txt

            - name: Run Pylint Check
              run: pylint --fail-under=9.0 app.py

    sca-scan:
        name: SCA Dependency Scan (pip-audit)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install pip-audit
              run: |
                  python -m pip install --upgrade pip
                  pip install pip-audit

            - name: Audit Dependencies
              run: pip-audit -r requirements.txt

    secret-scan:
        name: Secret Scanning (Gitleaks)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ---- Container Stage: build + scan saja (belum push, belum deploy) ----
    image-scan:
        name: Build Image & Trivy Scan
        needs: [sast-scan, pylint-check, sca-scan, secret-scan]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Build Docker Image
              run: docker build -t devsecops-app:${{ github.sha }} .

            # Pakai versi 0.36.0 (setelah insiden supply chain Maret 2026).
            # Lebih aman lagi: ganti dengan commit SHA lengkap + komentar versi.
            - name: Trivy Scan Image
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: devsecops-app:${{ github.sha }}
                  format: table
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true
                  vuln-type: os,library
                  exit-code: "1"

    notify-discord:
        name: Notify Discord
        needs: [sast-scan, pylint-check, sca-scan, secret-scan, image-scan]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Kirim hasil ke Discord
              env:
                  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
                  SAST: ${{ needs.sast-scan.result }}
                  PYLINT: ${{ needs.pylint-check.result }}
                  SCA: ${{ needs.sca-scan.result }}
                  SECRET: ${{ needs.secret-scan.result }}
                  TRIVY: ${{ needs.image-scan.result }}
                  REPO: ${{ github.repository }}
                  BRANCH: ${{ github.head_ref || github.ref_name }}
                  ACTOR: ${{ github.actor }}
                  SHA: ${{ github.sha }}
                  COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  if [ -z "$DISCORD_WEBHOOK_URL" ]; then
                      echo "Webhook Discord tidak tersedia, notifikasi dilewati."
                      exit 0
                  fi

                  icon() {
                      case "$1" in
                          success) echo "✅ lolos" ;;
                          failure) echo "❌ gagal" ;;
                          skipped) echo "⏭️ dilewati" ;;
                          cancelled) echo "⚪ dibatalkan" ;;
                          *) echo "❓ $1" ;;
                      esac
                  }

                  if [ "$SAST" = "success" ] && [ "$PYLINT" = "success" ] && [ "$SCA" = "success" ] && [ "$SECRET" = "success" ] && [ "$TRIVY" = "success" ]; then
                      COLOR=3066993
                      TITLE="✅ Pipeline LOLOS"
                  else
                      COLOR=15158332
                      TITLE="❌ Pipeline GAGAL"
                  fi

                  MSG=$(printf '%s' "$COMMIT_MSG" | head -n1 | cut -c1-100)
                  AI=$(cat /tmp/ai.txt 2>/dev/null || true)

                  payload=$(jq -n \
                      --arg title "$TITLE" \
                      --arg url "$RUN_URL" \
                      --argjson color "$COLOR" \
                      --arg repo "$REPO" \
                      --arg branch "$BRANCH" \
                      --arg actor "$ACTOR" \
                      --arg sha "${SHA:0:7}" \
                      --arg msg "$MSG" \
                      --arg sast "$(icon "$SAST")" \
                      --arg pylint "$(icon "$PYLINT")" \
                      --arg sca "$(icon "$SCA")" \
                      --arg secret "$(icon "$SECRET")" \
                      --arg trivy "$(icon "$TRIVY")" \
                      --arg ai "$AI" \
                      '{embeds: [{
                          title: $title, url: $url, color: $color,
                          description: ("Repo: **" + $repo + "**\nBranch: `" + $branch + "`\nOleh: " + $actor + "\nCommit: `" + $sha + "` " + $msg),
                          fields: ([
                              {name: "Semgrep (SAST)", value: $sast, inline: true},
                              {name: "Pylint (kualitas)", value: $pylint, inline: true},
                              {name: "pip-audit (SCA)", value: $sca, inline: true},
                              {name: "Gitleaks (secret)", value: $secret, inline: true},
                              {name: "Trivy (image)", value: $trivy, inline: true}
                          ] + (if $ai != "" then [{name: "Analisis AI (Gemini)", value: $ai}] else [] end))
                      }]}')

                  curl -sS -f -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
